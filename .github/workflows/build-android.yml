name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Creer le projet Expo
        run: npx --yes create-expo-app@latest app --template blank --yes

      - name: Ajouter les fichiers de l'application
        working-directory: app
        run: |
          cat > App.js << 'EOF_APP'
          import { useEffect, useRef, useState } from "react";
          import { ActivityIndicator, Platform, View, useColorScheme } from "react-native";
          import { StatusBar } from "expo-status-bar";
          import { SafeAreaProvider, SafeAreaView } from "react-native-safe-area-context";
          import { WebView } from "react-native-webview";
          import * as Notifications from "expo-notifications";
          import AsyncStorage from "@react-native-async-storage/async-storage";

          const HTML = require("./cap-html");
          const STORAGE_KEY = "cap-state";
          const CHANNEL = "rappels";

          // Afficher la notification même si l'app est ouverte
          Notifications.setNotificationHandler({
            handleNotification: async () => ({
              shouldShowAlert: true,
              shouldShowBanner: true,
              shouldShowList: true,
              shouldPlaySound: true,
              shouldSetBadge: false,
            }),
          });

          async function setupNotifications() {
            if (Platform.OS === "android") {
              await Notifications.setNotificationChannelAsync(CHANNEL, {
                name: "Rappels quotidiens",
                importance: Notifications.AndroidImportance.HIGH,
              });
            }
            const { status } = await Notifications.getPermissionsAsync();
            if (status !== "granted") await Notifications.requestPermissionsAsync();
          }

          export default function App() {
            const web = useRef(null);
            const dark = useColorScheme() === "dark";
            const [saved, setSaved] = useState(undefined); // undefined = chargement

            useEffect(() => {
              AsyncStorage.getItem(STORAGE_KEY).then((v) => setSaved(v || "")).catch(() => setSaved(""));
              setupNotifications().catch(() => {});
              // Toucher une notification ouvre l'écran « Aujourd'hui »
              const sub = Notifications.addNotificationResponseReceivedListener(() => {
                web.current?.injectJavaScript("window.dispatchEvent(new Event('cap-open-today'));true;");
              });
              return () => sub.remove();
            }, []);

            async function onMessage(event) {
              let msg;
              try { msg = JSON.parse(event.nativeEvent.data); } catch { return; }

              if (msg.type === "state") {
                await AsyncStorage.setItem(STORAGE_KEY, msg.json);
              } else if (msg.type === "schedule") {
                await Notifications.cancelAllScheduledNotificationsAsync();
                for (const n of msg.list) {
                  await Notifications.scheduleNotificationAsync({
                    content: { title: n.title, body: n.body },
                    trigger: { type: Notifications.SchedulableTriggerInputTypes.DATE, date: new Date(n.at), channelId: CHANNEL },
                  });
                }
              } else if (msg.type === "test") {
                await setupNotifications();
                await Notifications.scheduleNotificationAsync({
                  content: { title: msg.title, body: msg.body },
                  trigger: { type: Notifications.SchedulableTriggerInputTypes.TIME_INTERVAL, seconds: 5, channelId: CHANNEL },
                });
              }
            }

            const bg = dark ? "#121826" : "#EDF0F4";

            if (saved === undefined) {
              return (
                <View style={{ flex: 1, alignItems: "center", justifyContent: "center", backgroundColor: bg }}>
                  <ActivityIndicator />
                </View>
              );
            }

            // Les données enregistrées sont injectées avant le chargement de la page
            const inject = `window.__CAP_STATE__ = ${saved ? saved : "null"}; true;`;

            return (
              <SafeAreaProvider>
                <SafeAreaView style={{ flex: 1, backgroundColor: bg }} edges={["top", "bottom"]}>
                  <StatusBar style={dark ? "light" : "dark"} />
                  <WebView
                    ref={web}
                    source={{ html: HTML, baseUrl: "https://cap.app/" }}
                    originWhitelist={["*"]}
                    injectedJavaScriptBeforeContentLoaded={inject}
                    onMessage={onMessage}
                    javaScriptEnabled
                    domStorageEnabled
                    style={{ backgroundColor: bg }}
                  />
                </SafeAreaView>
              </SafeAreaProvider>
            );
          }
          EOF_APP
          cat > app.json << 'EOF_JSON'
          {
            "expo": {
              "name": "Cap",
              "slug": "taskad",
              "version": "1.0.0",
              "orientation": "portrait",
              "userInterfaceStyle": "automatic",
              "android": {
                "package": "com.adouiri1.taskad",
                "permissions": [
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.SCHEDULE_EXACT_ALARM",
                  "android.permission.RECEIVE_BOOT_COMPLETED"
                ]
              },
              "plugins": [
                "expo-notifications"
              ]
            }
          }
          EOF_JSON
